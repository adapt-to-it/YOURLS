# Local development stack for testing the Filament Skin plugin.
# Usage:
#   docker compose up -d
#   open http://localhost:8080/admin/
#
# First run: visit http://localhost:8080/admin/ → installer → use the DB
# credentials from the `db` service below.
# Activate the "Filament Skin" plugin from /admin/plugins.php to see the redesign.

services:
  yourls:
    build: .
    container_name: yourls-app
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount the whole repo so edits are live-reloaded
      - .:/var/www/html
      # Override config with the docker-only one (kept out of git)
      - ./docker/yourls-config.php:/var/www/html/user/config.php:ro
      # Drop in a working .htaccess so rewrite rules are present immediately
      - ./docker/yourls.htaccess:/var/www/html/.htaccess:ro
    environment:
      - APACHE_RUN_USER=#1000
      - APACHE_RUN_GROUP=#1000

  db:
    image: mariadb:11
    container_name: yourls-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: yourls
      MARIADB_USER: yourls
      MARIADB_PASSWORD: yourlspw
    volumes:
      - yourls-db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: yourls-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  yourls-db-data:
